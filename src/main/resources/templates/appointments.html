
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Doctor Booking</a>

        <div>
            <a href="/" class="btn btn-light btn-sm me-2">Home</a>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 id="pageTitle">My Appointments</h2>
    <p id="welcomeMessage" class="text-muted"></p>

    <div id="message" role="status" aria-live="polite"></div>

    <!-- Doctor: Create Availability -->
    <div id="doctorSection" class="card mb-4 d-none">
        <div class="card-body">
            <h5>Create Availability Slot</h5>

            <form id="slotForm">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Service ID</label>
                        <input type="number" id="serviceId"
                               class="form-control" min="1" required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="appointmentDate"
                               class="form-control" required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Start Time</label>
                        <input type="time" id="startTime"
                               class="form-control" required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">End Time</label>
                        <input type="time" id="endTime"
                               class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Slot
                </button>
            </form>
        </div>
    </div>

    <!-- Doctor Availability Slots -->
    <div id="doctorSlotsSection" class="card mb-4 d-none">
        <div class="card-body">
            <h5>My Availability Slots</h5>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-light">
                    <tr>
                        <th>Slot ID</th>
                        <th>Date</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="doctorSlotRows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Appointments Table -->
    <div class="card">
        <div class="card-body">
            <h5>Appointment List</h5>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th id="personHeading">Doctor / Patient</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th id="actionHeading">Action</th>
                    </tr>
                    </thead>
                    <tbody id="appointmentRows"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    let currentRole = "";

    const message = document.getElementById("message");
    const rows = document.getElementById("appointmentRows");

    function showMessage(text, type = "info") {
        message.textContent = text;
        message.className = "alert alert-" + type;
    }

    function addCell(row, value) {
        const cell = document.createElement("td");
        cell.textContent = value ?? "";
        row.appendChild(cell);
        return cell;
    }

    async function loadDashboard() {
        try {
            const sessionResponse = await fetch("/auth/session", {
                credentials: "same-origin"
            });

            if (!sessionResponse.ok) {
                window.location.href = "/login";
                return;
            }

            const session = await sessionResponse.json();

            if (!session.userId) {
                window.location.href = "/login";
                return;
            }

            currentRole = session.role;

            document.getElementById("welcomeMessage").textContent =
                "Logged in as " + (session.name || currentRole);

            if (currentRole === "Doctor") {
                document.getElementById("pageTitle").textContent =
                    "Doctor Dashboard";
                document.getElementById("doctorSection")
                    .classList.remove("d-none");
                document.getElementById("personHeading").textContent =
                    "Patient";
                document.getElementById("actionHeading").textContent = "";
            document.getElementById("doctorSlotsSection")
    .classList.remove("d-none");

await loadDoctorSlots();
            } else if (currentRole === "Patient") {
                document.getElementById("pageTitle").textContent =
                    "My Appointments";
                document.getElementById("personHeading").textContent =
                    "Doctor";
            } else {
                showMessage("Unknown account role.", "danger");
                return;
            }

            await loadAppointments();

        } catch (error) {
            showMessage("Unable to load dashboard.", "danger");
        }
    }

async function loadDoctorSlots() {
    const rows = document.getElementById("doctorSlotRows");
    rows.replaceChildren();

    try {
        const response = await fetch("/doctor/slots", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Unable to load availability slots.");
        }

        const slots = await response.json();

        if (slots.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 5;
            cell.textContent = "No available slots found.";

            row.appendChild(cell);
            rows.appendChild(row);
            return;
        }

        slots.forEach(slot => {
            const row = document.createElement("tr");

            addCell(row, slot.availId);
            addCell(row, slot.appointmentDate);
            addCell(row, slot.startTime);
            addCell(row, slot.endTime);

            const actionCell = document.createElement("td");
            const button = document.createElement("button");

            button.className = "btn btn-danger btn-sm";
            button.textContent = "Delete";

            button.addEventListener("click", function() {
                deleteDoctorSlot(slot.availId);
            });

            actionCell.appendChild(button);
            row.appendChild(actionCell);
            rows.appendChild(row);
        });

    } catch (error) {
        showMessage(error.message, "danger");
    }
}

async function deleteDoctorSlot(availId) {
    if (!confirm("Are you sure you want to delete this slot?")) {
        return;
    }

    try {
        const response = await fetch("/doctor/slots/" + availId, {
            method: "DELETE",
            credentials: "same-origin"
        });

        if (!response.ok) {
            showMessage(
                "Cannot delete this slot. It may have appointment history.",
                "danger"
            );
            return;
        }

        showMessage("Availability slot deleted successfully.", "success");
        await loadDoctorSlots();

    } catch (error) {
        showMessage("Unable to delete slot.", "danger");
    }
}

    async function loadAppointments() {
        const url = currentRole === "Doctor"
            ? "/doctor/appointments"
            : "/slot/user/appointments";

        try {
            const response = await fetch(url, {
                credentials: "same-origin"
            });

            if (!response.ok) {
                throw new Error("Could not load appointments.");
            }

            const appointments = await response.json();
            rows.replaceChildren();

            if (appointments.length === 0) {
                const row = document.createElement("tr");
                const cell = addCell(row, "No appointments found.");
                cell.colSpan = 7;
                rows.appendChild(row);
                return;
            }

            appointments.forEach(appointment => {
                const row = document.createElement("tr");

                addCell(row, appointment.appointmentId);

                addCell(
                    row,
                    currentRole === "Doctor"
                        ? appointment.patientName
                        : appointment.doctorName
                );

                addCell(row, appointment.serviceName);
                addCell(row, appointment.appointmentDate);

                addCell(
                    row,
                    appointment.startTime + " - " + appointment.endTime
                );

                const statusCell = document.createElement("td");
                const badge = document.createElement("span");
                badge.className = appointment.status === "CANCELLED"
                    ? "badge bg-secondary"
                    : "badge bg-success";
                badge.textContent = appointment.status;
                statusCell.appendChild(badge);
                row.appendChild(statusCell);

                const actionCell = document.createElement("td");

                if (currentRole === "Patient" &&
                    appointment.status === "SCHEDULED") {

                    const button = document.createElement("button");
                    button.className = "btn btn-danger btn-sm";
                    button.textContent = "Cancel";

                    button.addEventListener("click", () => {
                        cancelAppointment(appointment.appointmentId);
                    });

                    actionCell.appendChild(button);
                }

                row.appendChild(actionCell);
                rows.appendChild(row);
            });

        } catch (error) {
            showMessage(error.message, "danger");
        }
    }

    async function cancelAppointment(appointmentId) {
        if (!confirm("Cancel this appointment?")) {
            return;
        }

        try {
            const response = await fetch(
                "/appointment/" + appointmentId,
                {
                    method: "DELETE",
                    credentials: "same-origin"
                }
            );

            if (!response.ok) {
                showMessage("Unable to cancel appointment.", "danger");
                return;
            }

            showMessage("Appointment cancelled successfully.", "success");
            await loadAppointments();

        } catch (error) {
            showMessage("Server error.", "danger");
        }
    }

    document.getElementById("slotForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = {
            serviceId: Number(document.getElementById("serviceId").value),
            appointmentDate: document.getElementById("appointmentDate").value,
            startTime: document.getElementById("startTime").value,
            endTime: document.getElementById("endTime").value
        };

        try {
            const response = await fetch("/doctor/slots", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                showMessage("Unable to create availability slot.", "danger");
                return;
            }

         showMessage("Availability slot created successfully.", "success");
document.getElementById("slotForm").reset();
await loadDoctorSlots();
        } catch (error) {
            showMessage("Server error.", "danger");
        }
    });

    document.getElementById("logoutBtn")
        .addEventListener("click", async function() {

        try {
            const response = await fetch("/auth/logout", {
                method: "POST",
                credentials: "same-origin"
            });

            if (!response.ok) {
                showMessage("Logout failed.", "danger");
                return;
            }

            window.location.href = "/login";

        } catch (error) {
            showMessage("Unable to log out.", "danger");
        }
    });

    loadDashboard();
</script>

</body>
</html>
