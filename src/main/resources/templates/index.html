
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Appointment Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Doctor Booking</a>

        <div>
            <a href="/login" class="btn btn-light btn-sm">Login</a>
            <a href="/appointments" class="btn btn-outline-light btn-sm">
                My Appointments
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2>Doctor Appointment Booking</h2>
    <p>Find an available appointment with a doctor.</p>

    <div class="card mb-4">
        <div class="card-body">
            <h5>Search Appointments</h5>

            <form id="searchForm">
                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Doctor ID</label>
                        <input type="number" id="doctorId"
                               class="form-control" placeholder="Optional">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Service ID</label>
                        <input type="number" id="serviceId"
                               class="form-control" placeholder="Example: 1">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="date" class="form-control">
                    </div>

                </div>

                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>
    </div>

    <h3>Available Appointments</h3>
    <div id="message" class="mb-3" role="status"></div>
    <div id="results" class="row"></div>

</div>

<script>
    const results = document.getElementById("results");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "alert alert-" + type;
    }

    document.getElementById("searchForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const doctorId = document.getElementById("doctorId").value;
        const serviceId = document.getElementById("serviceId").value;
        const date = document.getElementById("date").value;

        const params = new URLSearchParams();

        if (doctorId) params.append("doctorId", doctorId);
        if (serviceId) params.append("serviceId", serviceId);
        if (date) params.append("date", date);

        results.innerHTML = "";
        showMessage("Loading appointments...", "info");

        try {
            const response = await fetch("/slot/search?" + params.toString());

            if (!response.ok) {
                throw new Error("Could not load appointments");
            }

            const slots = await response.json();

            message.textContent = "";
            message.className = "";

            if (slots.length === 0) {
                showMessage("No appointments found.", "warning");
                return;
            }

            slots.forEach(slot => {
                const col = document.createElement("div");
                col.className = "col-md-4 mb-3";

                const card = document.createElement("div");
                card.className = "card h-100";

                const body = document.createElement("div");
                body.className = "card-body";

                const name = document.createElement("h5");
                name.textContent = slot.doctorName;

                const specialty = document.createElement("p");
                specialty.textContent = slot.specialty;

                const dateText = document.createElement("p");
                dateText.textContent = "Date: " + slot.appointmentDate;

                const timeText = document.createElement("p");
                timeText.textContent = "Time: " + slot.startTime + " - " + slot.endTime;

                const button = document.createElement("button");
                button.className = "btn btn-success";
                button.textContent = "Book Appointment";

                button.onclick = () => bookAppointment(slot.availId, button);

                body.append(name, specialty, dateText, timeText, button);
                card.appendChild(body);
                col.appendChild(card);
                results.appendChild(col);
            });

        } catch (error) {
            showMessage(error.message, "danger");
        }
    });

    async function bookAppointment(availId, button) {
        const serviceId = document.getElementById("serviceId").value;

        if (!serviceId) {
            showMessage("Please enter a Service ID and search again before booking.", "warning");
            return;
        }

        button.disabled = true;

        try {
            const response = await fetch("/appointment/book", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    availId: availId,
                    serviceId: Number(serviceId)
                })
            });

            if (response.ok) {
                showMessage("Appointment booked successfully!", "success");
                button.textContent = "Booked";
            } else if (response.status === 401 || response.status === 403) {
                showMessage("Please log in as a patient first.", "warning");
                button.disabled = false;
            } else {
                showMessage("Booking failed. Please try again.", "danger");
                button.disabled = false;
            }

        } catch (error) {
            showMessage("Server error. Please try again.", "danger");
            button.disabled = false;
        }
    }

    document.getElementById("searchForm").requestSubmit();
</script>

</body>
</html>
